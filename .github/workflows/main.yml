name: CI - Build & Test IsCoolGPT API

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run Unit Tests
        run: ./mvnw test

      # Build Docker image (opcional, só se quiser garantir que o build funciona no CI)
      - name: Build Docker Image
        run: docker build -t iscool-gpt-api .

      # (opcional) Testa se a imagem sobe
      # - name: Run Docker container test
      #   run: docker run --rm -d -p 8080:8080 iscool-gpt-api

