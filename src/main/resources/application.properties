spring.application.name=iscool-gpt-api

# CONFIGURACAO DO ACTUATOR (Monitoramento e Health Check)
management.endpoints.web.exposure.include=health,info
management.endpoints.web.base-path=/actuator

# --- CONFIGURAÇÃO DA API GEMINI ---
# URL da API (usando o modelo gemini-2.5-flash-preview-09-2025)
llm.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent

# Chave da API (será injetada pela variável de ambiente LLM_API_KEY)
# Para testes locais, você pode usar o application-local.properties
llm.api.key=${LLM_API_KEY}
